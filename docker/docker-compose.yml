# ═══════════════════════════════════════════════════════════════════
# PySpark Failure Lab — Docker Compose
# Phase 2: Core Spark Cluster (Custom Image)
# Spark 3.5.3 · ARM64 native · eclipse-temurin:17-jre
# ═══════════════════════════════════════════════════════════════════

services:

  # ── Spark Master ───────────────────────────────────────────────
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: pyspark-failure-lab:3.5.3
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MASTER_HOST=spark-master
    command: master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - spark-events:/opt/spark/spark-events
    mem_limit: 1g
    cpus: 1.0
    networks:
      - spark-lab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Spark Worker 1 ─────────────────────────────────────────────
  spark-worker-1:
    image: pyspark-failure-lab:3.5.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_WEBUI_PORT=8081
    command: worker
    ports:
      - "8081:8081"
    volumes:
      - spark-events:/opt/spark/spark-events
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - spark-lab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Spark Worker 2 ─────────────────────────────────────────────
  spark-worker-2:
    image: pyspark-failure-lab:3.5.3
    container_name: spark-worker-2
    hostname: spark-worker-2
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_WEBUI_PORT=8082
    command: worker
    ports:
      - "8082:8082"
    volumes:
      - spark-events:/opt/spark/spark-events
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - spark-lab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Spark History Server ───────────────────────────────────────
  spark-history:
    image: pyspark-failure-lab:3.5.3
    container_name: spark-history
    hostname: spark-history
    environment:
      - SPARK_EVENTS_DIR=/opt/spark/spark-events
    command: history-server
    ports:
      - "18080:18080"
    volumes:
      - spark-events:/opt/spark/spark-events
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - spark-lab-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

# ── Volumes ────────────────────────────────────────────────────────
volumes:
  spark-events:
    driver: local

# ── Networks ───────────────────────────────────────────────────────
networks:
  spark-lab-net:
    driver: bridge
    name: spark-lab-net
